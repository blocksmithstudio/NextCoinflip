# The title and size of the gui
title: "            &nActive Coinflip"
size: 45

# Slots for the coinflip game
games-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]

# The footer placeholder for the coinflip item
footer-placeholder:
  self: "&c&l✘ &cClick to Cancel &c&l✘"
  others: "&a&l✔ &aClick to Play &a&l✔"
# List of wager items
wager-items:
  currency:
    display-name: "{creator_display_name} &#8cc1cdCoinflip"
    lore:
      - " &6◆ &#8cc1cdWager: &a{wager_digits} {currency} &7(${wager_format} {currency})"
      - " &6◆ &#8cc1cdCreated: &f{time_elapsed} ago"
      - " "
      - "{footer}"
  item:
    display-name: "{creator_display_name} &#8cc1cdCoinflip"
    header-lore:
      - " "
      - "{item_display_name} &7({item_amount}x)"
    footer-lore:
      - " "
      - " &6◆ &#8cc1cdWager: &aItem in your hand"
      - " &6◆ &#8cc1cdCreated: &f{time_elapsed} ago"
      - " "
      - "{footer}"

# Won items inside the gui
won-item:
  slots: [44]
  # Won items if there is no item to claim
  empty:
    material: GRAY_DYE
    display-name: "&c&l✘ &cNo Claimable Items &c&l✘"
    lore:
      - " &7◆ &#8cc1cdYou do not have any pending"
      - "   &#8cc1cdcoinflipped items to claim."
  # Won items if there is something to claim
  filled:
    material: LIME_DYE
    display-name: "&f{total} &#8cc1cditem(s) available to claim."
    lore:
      - " &a➜ Click &#8cc1cdto &aview &#8cc1cdyour won items."

# List of additional items
items:
  next_page:
    type: next_page
    material: ARROW
    display-name: "&aNext Page"
    slots: [26]
    lore:
      - "&7Click to go to the next page."
  previous_page:
    type: previous_page
    material: ARROW
    display-name: "&cPrevious Page"
    slots: [18]
    lore:
      - "&7Click to go to the previous page."
  stats:
    type: stats
    material: BOOKSHELF
    display-name: "&#8cc1cdYour Coinflip Stats"
    slots: [40]
    lore:
      - "&a&l✔ &aClick to &nView&a&l ✔"
  information:
    material: EMERALD
    display-name: "&#8cc1cdCoinflip is a game of luck, where each"
    slots: [4]
    lore:
      - "&#8cc1cdparticipating player has a &e&n50%&#8cc1cd chance"
      - "&#8cc1cdof &a&nwinning&#8cc1cd both players' wager"
      - " "
      - "&#8cc1cdYou can host your own coinlfip"
      - "&#8cc1cdby typing: &a/cf <amount>"
      - " "
      - "&#8cc1cdYou can also wager items by holding"
      - "&#8cc1cdthe item and typing: &a/cf hand"
  filler:
    material: GRAY_STAINED_GLASS_PANE
    display-name: " "
    slots: [0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 27, 35, 36, 37, 38, 39, 41, 42, 43]
    commands: []
    lore: []